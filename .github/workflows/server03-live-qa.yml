name: Server 03 live QA (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  live:
    if: github.head_ref == 'qa-server03-live-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/live-server03-qa.mjs
  browser:
    if: github.head_ref == 'qa-server03-live-20261126'
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install chromium
      - run: node scripts/live-server03-browser.mjs
