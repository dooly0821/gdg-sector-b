name: GDG private-room live smoke test
on:
  push:
    branches: [diagnostics-coop-live-20261126]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Execute bounded private-room test
        shell: bash
        run: |
          node --input-type=module <<'GDG_JS'
          // Limited, private-room smoke test. No public rooms, no credentials required.
          import {performance} from 'node:perf_hooks';
          const URL='https://gdg-sector-b.vercel.app/api/room';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const pctl=(arr,p)=>arr.length?Math.round([...arr].sort((a,b)=>a-b)[Math.max(0,Math.ceil(arr.length*p)-1)]):null;
          const clients=[];let requests=0;
          async function call(body){
           const start=performance.now();requests++;
           try{const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(4500)});
           let json;try{json=await r.json()}catch{json={error:'non-JSON response'};}
           return {status:r.status,json,ms:performance.now()-start};
           }catch(e){return {status:0,json:{error:e.name},ms:performance.now()-start};}
          }
          async function retry(body){let result;for(let i=0;i<5;i++){result=await call(body);if(result.status===200)return result.json;if(result.status!==423)break;await wait(100+i*70);}throw Error(body.op+' HTTP '+result.status+' '+String(result.json.error??'').slice(0,100));}
          async function stage(n){
           const own=[];let room;
           try{
            const first=await retry({op:'create',nickname:'GDGTEST01'});room=first.snapshot.room;own.push({token:first.token,seq:0,snap:first.snapshot});clients.push(...own);
            for(let i=1;i<n;i++){const j=await retry({op:'join',room,nickname:'GDGTEST0'+(i+1)});const c={token:j.token,seq:0,snap:j.snapshot};own.push(c);clients.push(c);}
            await retry({op:'start',room,token:own[0].token});
            for(const c of own){const r=await retry({op:'ready',room,token:c.token});c.snap=r.snapshot;}
            if(own.at(-1).snap.phase!=='playing')throw Error('not playing');
            const start=performance.now(),duration=10000,stats=[],gaps=[],drifts=[];let frames=0,valid=0,ended=false;
            await Promise.all(own.map(async(c,i)=>{
             let rtt=120,cont=0,last=start,priorElapsed=0,tick=0;
             await wait(i*43);
             while(performance.now()-start<duration&&!ended&&requests<260){
              const elapsed=performance.now()-start,phase=Math.floor(elapsed/1600)%4;
              const keys=phase===0?['KeyW','ShiftLeft']:phase===1?['KeyW','ShiftLeft','KeyC','Space']:phase===2?['KeyD','KeyC','Space']:['KeyS'];
              const commands=tick%12===0?[{seq:++c.seq,type:'torch'}]:[];
              const r=await call({op:'sync',room,token:c.token,input:{keys,yaw:i*Math.PI/2+phase*.25,pitch:0},commands});stats.push({status:r.status,ms:r.ms});
              if(r.status===200){const s=r.json.snapshot;if(!s||!s.self||s.players.length!==n||!['x','y','z','vx','vz'].every(k=>Number.isFinite(s.self[k])))throw Error('invalid snapshot');
               const now=performance.now();gaps.push(now-last);last=now;valid++;if(s.elapsed<priorElapsed)throw Error('server clock reversed');priorElapsed=s.elapsed;c.snap=s;
               if(s.phase!=='playing')ended=true;
               rtt=rtt*.8+r.ms*.2;cont=Math.max(0,cont-1);tick++;
              }else if(r.status===423){cont=Math.min(5,cont+1);}else if([401,404,503].includes(r.status)||r.status===0){ended=true;}
              frames++;
              const normal=Math.max(55,Math.min(155,35+rtt*.25+Math.max(0,n-2)*15));
              await wait((r.status===423?Math.min(220,45+20*cont)+32:normal+14));
             }
            }));
            const ok=stats.filter(r=>r.status===200),statusCounts={};for(const r of stats)statusCounts[r.status]=(statusCounts[r.status]??0)+1;
            const wall=(performance.now()-start)/1000;
            const report={players:n,seconds:+wall.toFixed(2),requests:stats.length,statusCounts,successful:valid,medianMs:pctl(ok.map(r=>r.ms),.5),p95Ms:pctl(ok.map(r=>r.ms),.95),maxMs:pctl(ok.map(r=>r.ms),1),p95SnapshotGapMs:pctl(gaps,.95),maxSnapshotGapMs:pctl(gaps,1),gameSeconds:+Math.max(...own.map(c=>c.snap.elapsed??0)).toFixed(2),lastPhases:own.map(c=>c.snap.phase),moved:own.map(c=>+(c.snap.self.steps??0).toFixed(2))};
            console.log('GDG_RESULT '+JSON.stringify(report));
            return report;
           }finally{if(room)for(const c of own.reverse()){try{await retry({op:'leave',room,token:c.token})}catch(e){console.log('cleanup: '+e.message)}}}
          }
          const start=performance.now();const health=await fetch(URL,{signal:AbortSignal.timeout(6000)});const data=await health.json();console.log('GDG_HEALTH '+JSON.stringify({http:health.status,ms:Math.round(performance.now()-start),online:data.online,storage:data.storage,region:data.region,maxPlayers:data.maxPlayers}));
          if(!health.ok||!data.online)throw Error('health check failed');
          const reports=[];for(const n of [2,4]){reports.push(await stage(n));await wait(400);}
          console.log('GDG_SUMMARY '+JSON.stringify({reports,requests}));
          GDG_JS
