name: Private production team chat QA
on:
  pull_request:
    branches: [main]
jobs:
  private-live-chat:
    if: github.head_ref == 'qa-live-team-chat-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/live-private-chat.mjs
