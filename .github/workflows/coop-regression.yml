name: Co-op regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js && node --check dist/multiplayer.js && node --check dist/mission.js && node --check dist/haunt.js && node --check server/room-core.js
      - run: node scripts/check-haunt-release.mjs
      - run: node scripts/check-climb-routes.mjs

  live-health:
    if: github.head_ref == 'coop-input-replay-pickup-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-live-health.mjs
