name: UI browser regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install chromium
      - run: node scripts/check-ui-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-screenshots
          path: /tmp/gdg-ui-*.png
