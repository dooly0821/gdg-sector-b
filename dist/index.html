<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121513"><meta name="description" content="Clock in for a first-person delivery shift at the GDG Central Logistics Warehouse."><title>Sector B — Graveyard Delivery Group</title><link rel="icon" href="assets/stamp.webp"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="work.css"><link rel="preload" as="image" href="assets/interface/warehouse.webp"></head><body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-5 9 5v10l-9 5-9-5Zm0 0 9 5 9-5m-9 5v10M7.5 4.5l9 5v4"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm12-2a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13 0 5 6m0-6-5 6"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="m10 3-.7 2.4-2 .9-2.3-.6L3 9l1.7 1.8v2.4L3 15l2 3.3 2.3-.6 2 .9L10 21h4l.7-2.4 2-.9 2.3.6 2-3.3-1.7-1.8v-2.4L21 9l-2-3.3-2.3.6-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2Zm6-2v15m6-12v15"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="i-pad" viewBox="0 0 24 24"><path d="M8 6h8c3 0 4 2 5 7s1 6-1 6c-1 0-4-4-5-4H9c-1 0-4 4-5 4-2 0-2-2-1-6s2-7 5-7Zm-1 3v5m-2-2.5h4"/><circle cx="15" cy="10" r=".8"/><circle cx="18" cy="12" r=".8"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="m6 3 15 9-15 9Z"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4"/></symbol>
<symbol id="i-screen" viewBox="0 0 24 24"><path d="M3 4h18v13H3Zm5 17h8m-4-4v4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
</defs></svg>
<main id="briefing" aria-label="GDG 게임 시작 메뉴">
  <div class="menu-stage">
    <h1 class="menu-logo"><img src="assets/interface/wordmark.webp" alt="GDG — Graveyard Delivery Group"></h1>
    <img class="menu-tagline" src="assets/interface/tagline.webp" alt="초자연적 현상이 보고된 물류 구역에서 배송 임무를 수행하세요.">
    <nav class="menu-actions" aria-label="메인 메뉴">
      <button class="art-button start-button" id="start" aria-label="게임 시작"><img src="assets/interface/start.webp" alt=""><img class="rays" src="assets/interface/rays.webp" alt=""><img class="stamp-pointer" src="assets/interface/pointer.webp" alt=""><span class="resume-label" hidden>이어서 근무</span></button>
      <button class="art-button" data-pane="manual" aria-label="조작 방법"><img src="assets/interface/manual.webp" alt=""></button>
      <button class="art-button" data-pane="settings" aria-label="설정"><img src="assets/interface/settings.webp" alt=""></button>
      <button class="art-button" data-pane="quit" aria-label="종료"><img src="assets/interface/quit.webp" alt=""></button>
    </nav>
  </div>
  <button class="facility-link" data-pane="map"><svg><use href="#i-map"/></svg>구역 지도</button>
</main>
<section id="loading" hidden aria-label="Sector B 구역 진입">
  <div class="loading-strip"><img class="load-ticket" src="assets/interface/loading-label.webp" alt="집화 중입니다"><div class="load-plate">
    <div id="progress" role="progressbar" aria-label="출근 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  </div><p id="load-detail" role="status">구역 준비 중</p></div>
</section>
<section id="play" hidden><canvas id="world" tabindex="0" aria-label="Sector B 1인칭 창고"></canvas>
  <div class="work-mission"><strong><svg><use href="#i-box"/></svg> WORK 모드</strong><div><b>배송 작업</b> <span id="delivered">0 / 5</span></div><small id="taskLine"></small></div>
  <div class="work-compass" aria-label="방위"><span id="heading"></span><i></i></div>
  <div id="reticle"></div><div id="target-brackets" hidden></div><div id="waypoint" hidden></div><div id="radio" aria-live="polite"></div><div id="prompt"></div>
  <div id="torch-status">Q · 손전등 OFF</div><div id="carry-status"><svg><use href="#i-box"/></svg><span>빈손</span></div><output id="receipt" hidden></output><button class="pause-icon" id="pause" aria-label="일시 정지">Ⅱ</button>
</section>
<section id="ended" hidden><div><img src="assets/interface/wordmark.webp" alt="GDG"><h2>근무를 종료했습니다</h2><button class="primary" data-action="brief">메인 메뉴로</button></div></section>
<div id="modal" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="paneTitle"><div class="panel-head"><small id="eyebrow">GDG DISPATCH</small><button class="square" id="close" aria-label="닫기"><svg><use href="#i-close"/></svg></button></div><h2 id="paneTitle"></h2><div id="paneBody"></div></section></div><script type="module" src="app.js"></script></body></html>
